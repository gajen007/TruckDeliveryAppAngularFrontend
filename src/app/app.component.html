<ion-app>
    <ion-menu *ngIf="menuAppear" contentId="main-content" type="overlay">
      <ion-content>
        <ion-list>
          <ion-list-header>Menu Header</ion-list-header>
          <ion-note>User Name</ion-note>
          <ion-menu-toggle auto-hide="false">
            <ion-item 
            *ngFor="let p of menuItems; let i = index" 
            routerDirection="root" 
            [routerLink]="[p.url]" 
            lines="none" 
            detail="false" 
            routerLinkActive="selected">
              <fa-icon [icon]="p.icon"></fa-icon>&nbsp;
              <ion-label>{{ p.title }}</ion-label>
            </ion-item>
            <ion-item  style="color:red" (click)="logout($event)">
              <fa-icon [icon]="logoutIcon"></fa-icon>&nbsp;
              <ion-label>Logout</ion-label>
            </ion-item>
          </ion-menu-toggle>
        </ion-list>
      </ion-content>
    </ion-menu>
    <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
