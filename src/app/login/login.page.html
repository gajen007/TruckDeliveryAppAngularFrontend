<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col>
        <ion-card>
          <ion-card-header>
            <ion-card-title>{{userType|titlecase}} Log-In</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <ion-row>
              <ion-col>
                <ion-input type="text" [(ngModel)]="unLogin" placeholder="eMail"></ion-input>
              </ion-col>
            </ion-row>
            <ion-row>
              <ion-col>
                <ion-input type="password" [(ngModel)]="pwLogin" placeholder="Password"></ion-input>
              </ion-col>
            </ion-row>
            <ion-row>
              <ion-col align="center">
                <ion-button color="success" size="medium" (click)="login($event)">Login</ion-button>
              </ion-col>
            </ion-row>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col>
        <ion-card>
          <ion-card-header>
            <ion-card-title>{{userType|titlecase}} Sign-Up</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <ion-row>
              <ion-col>
                <ion-input type="text" [(ngModel)]="unSignUp" placeholder="Name"></ion-input>
              </ion-col>
            </ion-row>
            <ion-row>
              <ion-col>
                <ion-input type="password" [(ngModel)]="pwSignUp" placeholder="Password"></ion-input>
              </ion-col>
            </ion-row>

            <ion-row>
              <ion-col>
                <ion-input type="email" [(ngModel)]="emSignUp" placeholder="eMail"></ion-input>
              </ion-col>
            </ion-row>

            <ion-row>
              <ion-col>
                <ion-input type="email" [(ngModel)]="contactNumber" placeholder="Phone Number"></ion-input>
              </ion-col>
            </ion-row>

            <ion-row>
              <ion-col align="center">
                <ion-button color="primary" size="medium" (click)="signUp($event)">Sign Up</ion-button>
              </ion-col>
            </ion-row>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
