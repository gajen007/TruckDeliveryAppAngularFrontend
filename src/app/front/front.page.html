<ion-header>
  <ion-toolbar>
    <ion-title>Truck Delivery</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>
 <ion-grid>
  <ion-row id="row1">
    <ion-col size="12" align="center">
      <ion-button (click)="direct($event,'client')" size="large" shape="round" color="warning" fill="outline">
        <ion-icon name="person-outline"></ion-icon>&nbsp;Client
      </ion-button>
    </ion-col>
    </ion-row>
    <ion-row id="row2">
    <ion-col size="12" align="center">
      <ion-button (click)="direct($event,'staff')" size="large" shape="round" color="danger" fill="outline">
        <ion-icon name="headset-outline"></ion-icon>&nbsp;Staff
      </ion-button>
    </ion-col>
  </ion-row>
  <ion-row id="row3">
    <ion-col size="12" align="center">
      <ion-button (click)="direct($event,'driver')" size="large" shape="round" color="secondary" fill="outline">
        <ion-icon name="car-outline"></ion-icon>&nbsp;Driver
      </ion-button>
    </ion-col>
  </ion-row>
 </ion-grid>
</ion-content>
